<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, user-scalable=yes" />
    <meta name="theme-color" content="#1a9f8a" />
    <meta name="description" content="Günlük namaz vakitleri ve iftar saati. Türkiye'nin tüm şehirleri için anlık iftar geri sayımı." />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="İftar Vakti - Namaz Vakitleri" />
    <meta property="og:description" content="Günlük namaz vakitleri ve iftar saati. Anlık geri sayım ile iftar vaktini kaçırmayın." />
    <meta property="og:image" content="%PUBLIC_URL%/og-image.png" />
    
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="İftar Vakti - Namaz Vakitleri" />
    <meta name="twitter:description" content="Günlük namaz vakitleri ve iftar saati. Anlık geri sayım ile iftar vaktini kaçırmayın." />
    
    <!-- Apple Touch -->
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/icons/icon-192x192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="İftar Vakti" />
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    
    <title>İftar Vakti - Namaz Vakitleri</title>
    
    <!-- Preconnect for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://api.aladhan.com" />
  </head>
  <body>
    <noscript>Bu uygulamayı kullanabilmek için JavaScript'i etkinleştirmeniz gerekmektedir.</noscript>
    <div id="root"></div>
    
    <!-- Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/service-worker.js')
            .then(function(registration) {
              console.log('ServiceWorker registration successful');
            })
            .catch(function(err) {
              console.log('ServiceWorker registration failed: ', err);
            });
        });
      }
    </script>
  </body>
</html>
